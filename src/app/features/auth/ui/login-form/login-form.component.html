<p-card [header]="'loginForm.header' | transloco">
  <form class="flex flex-column gap-4" [formGroup]="form" (ngSubmit)="submit()">
    <p-floatlabel>
      <input pInputText id="email" type="email" formControlName="email" class="w-full" />
      <label for="email">{{ 'loginForm.email' | transloco }}</label>
    </p-floatlabel>

    <p-floatlabel>
      <p-password inputId="password" formControlName="password" [toggleMask]="true" [feedback]="false" styleClass="w-full" inputStyleClass="w-full"></p-password>
      <label for="password">{{ 'loginForm.password' | transloco }}</label>
    </p-floatlabel>

    <button pButton type="submit" [label]="'loginForm.signIn' | transloco"></button>
  </form>
</p-card>
