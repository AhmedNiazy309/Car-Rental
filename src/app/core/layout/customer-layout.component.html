<p-toast position="top-right"></p-toast>
<p-confirmDialog [style]="{ width: 'min(440px, 92vw)' }" [appendTo]="'body'"></p-confirmDialog>

<div class="customer-layout">
  <header class="customer-topbar">
    <div class="topbar-container">
      <div class="topbar-brand" routerLink="/cars">
        <i class="pi pi-car"></i>
        <span>{{ 'app.name' | transloco }}</span>
      </div>

      <nav class="topbar-nav">
        <a pRipple routerLink="/cars" routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
          <i class="pi pi-car"></i>
          <span>{{ 'nav.cars' | transloco }}</span>
        </a>
        <a pRipple routerLink="/orders" routerLinkActive="active" class="nav-link">
          <i class="pi pi-shopping-cart"></i>
          <span>{{ 'nav.myOrders' | transloco }}</span>
        </a>
        <a pRipple routerLink="/installments" routerLinkActive="active" class="nav-link">
          <i class="pi pi-wallet"></i>
          <span>{{ 'nav.installments' | transloco }}</span>
        </a>
      </nav>

      <div class="topbar-actions">
        @if (auth.user()?.wallet) {
          <span class="wallet-badge">
            <i class="pi pi-wallet"></i>
            {{ auth.user()?.wallet }} SAR
          </span>
        }
        <button pButton [text]="true" severity="secondary" (click)="locale.navigateToOtherLang()"
                class="p-button-rounded"><i class="pi pi-language"></i></button>
        <button pButton [text]="true" severity="secondary" (click)="theme.toggle()"
                class="p-button-rounded"><i [class]="theme.isDark() ? 'pi pi-sun' : 'pi pi-moon'"></i></button>
        <button pButton [text]="true" severity="danger" (click)="auth.logout()"
                class="p-button-rounded" pTooltip="Logout"><i class="pi pi-sign-out"></i></button>
      </div>
    </div>
  </header>

  <main class="customer-content">
    <router-outlet></router-outlet>
  </main>
</div>
